name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-recipes:
    name: Validate recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check recipes.json against reference presets
        run: python3 -I scripts/validate_recipes.py

  shaders:
    name: Validate shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install glslang
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools
      - name: Compile every shader as GLSL ES (with shared includes inlined, as the app does)
        run: python3 -I scripts/check_shaders.py

  android:
    name: Lint, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Lint, unit tests, debug APK
        run: ./gradlew lint testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: silverpoint-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
